name: weston-bundle-aarch64-musl
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04-arm   # free on public repos
    steps:
      - name: Write build script
        run: |
          mkdir out
          cat > build.sh << 'EOF'
          set -e
          PKGS="weston weston-backend-drm weston-shell-desktop xkeyboard-config eudev"
          apk add $PKGS

          cat > /usr/local/bin/start-weston << 'EOS'
          #!/bin/sh
          export PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
          export XDG_RUNTIME_DIR=/run/user/0
          export LIBSEAT_BACKEND=builtin
          mkdir -p $XDG_RUNTIME_DIR && chmod 700 $XDG_RUNTIME_DIR
          udevd --daemon
          udevadm trigger
          udevadm settle
          exec weston --backend=drm --renderer=pixman
          EOS
          chmod +x /usr/local/bin/start-weston

          cd /
          : > /tmp/files
          for p in $PKGS; do apk info -L $p | grep / >> /tmp/files; done
          echo usr/local/bin/start-weston >> /tmp/files

          # shared libs those files link against (skip musl libc itself)
          for f in $(cat /tmp/files); do
            [ -f "$f" ] && ldd "$f" 2>/dev/null
          done | awk '/=>/ {print $3}' | grep -v musl | sed 's|^/||' >> /tmp/files
          sort -u /tmp/files -o /tmp/files

          tar -chzf /out/weston.tar.gz -T /tmp/files
          EOF

      - name: Build in Alpine
        run: |
          docker run --rm \
            -v "$PWD/out":/out -v "$PWD/build.sh":/build.sh \
            alpine sh /build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: weston-aarch64-musl
          path: out/weston.tar.gz

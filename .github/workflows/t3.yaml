name: build-wpa-supplicant

on:
  workflow_dispatch:
    inputs:
      version:
        description: "wpa_supplicant version"
        default: "2.11"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Write build script
        run: |
          cat > build.sh <<'SCRIPT'
          set -eux

          apk add build-base linux-headers pkgconf \
            libnl3-dev libnl3-static \
            openssl-dev openssl-libs-static \
            wget file

          wget "https://w1.fi/releases/wpa_supplicant-${WPA_VERSION}.tar.gz"
          tar xf "wpa_supplicant-${WPA_VERSION}.tar.gz"
          cd "wpa_supplicant-${WPA_VERSION}/wpa_supplicant"

          printf '%s\n' \
            CONFIG_DRIVER_NL80211=y \
            CONFIG_LIBNL32=y \
            CONFIG_TLS=openssl \
            CONFIG_CTRL_IFACE=y \
            CONFIG_IEEE80211W=y \
            CONFIG_IEEE80211N=y \
            CONFIG_IEEE80211AC=y \
            CONFIG_SAE=y \
            > .config
          cat .config

          export CFLAGS="-Os"
          export LDFLAGS="-static"
          make -j"$(nproc)" > /tmp/build.log 2>&1 || { tail -n 60 /tmp/build.log; exit 1; }

          strip wpa_supplicant wpa_passphrase
          file wpa_supplicant wpa_passphrase
          cp wpa_supplicant wpa_passphrase /out/
          SCRIPT

      - name: Build static aarch64 musl binaries in Alpine
        env:
          WPA_VERSION: ${{ inputs.version || '2.11' }}
        run: |
          mkdir -p out
          docker run --rm \
            -e WPA_VERSION \
            -v "$PWD/build.sh:/build.sh:ro" \
            -v "$PWD/out:/out" \
            -w /work \
            alpine:latest sh /build.sh
      - name: Verify
        run: |
          ls -l out
          file out/wpa_supplicant out/wpa_passphrase
          file out/wpa_supplicant | grep -q "static"
          file out/wpa_supplicant | grep -q "ARM aarch64"
      - uses: actions/upload-artifact@v4
        with:
          name: wpa-supplicant-aarch64-musl
          path: out/

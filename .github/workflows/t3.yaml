name: Build iwd (aarch64, musl)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      alpine_version:
        description: "Alpine version to build against (match your target's musl)"
        default: "3.22"
      iwd_ref:
        description: "iwd branch or tag"
        default: master
      ell_ref:
        description: "ell branch or tag"
        default: master
      iw_ref:
        description: "iw branch or tag"
        default: master

permissions:
  contents: read

jobs:
  build:
    name: Build (aarch64, musl)
    runs-on: ubuntu-24.04-arm
    env:
      ALPINE_VERSION: ${{ inputs.alpine_version || '3.22' }}
      IWD_REF: ${{ inputs.iwd_ref || 'master' }}
      ELL_REF: ${{ inputs.ell_ref || 'master' }}
      IW_REF: ${{ inputs.iw_ref || 'master' }}

    steps:
      - name: Write build script
        run: |
          cat > build.sh <<'EOF'
          #!/bin/sh
          set -eux

          # coreutils: GNU ln (iwd/ell build uses `ln -t`, BusyBox lacks it)
          # dbus: daemon + uuidgen, bundled for the target
          apk add --no-cache \
            build-base autoconf automake libtool pkgconf git file linux-headers \
            coreutils dbus \
            readline-dev ncurses-dev dbus-dev libnl3-dev

          if ! ln --version >/dev/null 2>&1; then
            ln -sf /usr/bin/ln /bin/ln
          fi
          ln --version | head -1

          cd /work
          git clone --depth 1 --branch "$ELL_REF" https://git.kernel.org/pub/scm/libs/ell/ell.git
          git clone --depth 1 --branch "$IWD_REF" https://git.kernel.org/pub/scm/network/wireless/iwd.git
          git clone --depth 1 --branch "$IW_REF"  https://git.kernel.org/pub/scm/linux/kernel/git/jberg/iw.git
          git clone --depth 1 https://git.kernel.org/pub/scm/linux/kernel/git/wens/wireless-regdb.git

          OUT=/work/out
          mkdir -p "$OUT"

          # iwd picks up ../ell and builds it in
          cd /work/iwd
          ./bootstrap
          ./configure \
            --prefix=/usr \
            --sysconfdir=/etc \
            --localstatedir=/var \
            --enable-tools \
            --enable-wired \
            --disable-systemd-service \
            --disable-manual-pages
          make -j"$(nproc)"
          make install DESTDIR="$OUT"

          cd /work
          make -C iw -j"$(nproc)"
          make -C iw install DESTDIR="$OUT" PREFIX=/usr

          install -Dm644 wireless-regdb/regulatory.db     "$OUT/lib/firmware/regulatory.db"
          install -Dm644 wireless-regdb/regulatory.db.p7s "$OUT/lib/firmware/regulatory.db.p7s"

          # ---- bundle dbus (daemon, uuidgen, config) ----
          mkdir -p "$OUT/usr/bin" "$OUT/usr/share/dbus-1" "$OUT/etc/dbus-1"
          cp -a /usr/bin/dbus-daemon /usr/bin/dbus-uuidgen /usr/bin/dbus-send "$OUT/usr/bin/"
          cp -a /usr/share/dbus-1/. "$OUT/usr/share/dbus-1/"
          cp -a /etc/dbus-1/. "$OUT/etc/dbus-1/" 2>/dev/null || true

          # ---- bundle every shared lib the binaries need (except musl itself) ----
          find "$OUT" -type f -perm -u+x ! -name '*.so*' > /tmp/bins
          while read -r f; do
            ldd "$f" 2>/dev/null || true
          done < /tmp/bins \
            | awk '/=>/ && $3 ~ /^\// && $3 !~ /ld-musl|libc\.musl/ {print $3}' \
            | sort -u > /tmp/libs
          while read -r lib; do
            mkdir -p "$OUT$(dirname "$lib")"
            cp -L "$lib" "$OUT$lib"
          done < /tmp/libs
          echo "== bundled libs =="; cat /tmp/libs

          {
            echo "alpine: $ALPINE_VERSION  musl: $(apk info -v musl)"
            echo "ell:   $(git -C ell rev-parse HEAD)"
            echo "iwd:   $(git -C iwd rev-parse HEAD)"
            echo "iw:    $(git -C iw rev-parse HEAD)"
            echo "regdb: $(git -C wireless-regdb rev-parse HEAD)"
            echo
            echo "== installed files =="
            (cd "$OUT" && find . -type f | sort)
            echo
            echo "== runtime libraries =="
            while read -r f; do
              echo "--- $f"; ldd "$f" 2>&1 || true
            done < /tmp/bins
          } | tee "$OUT/BUILDINFO.txt"

          tar -C "$OUT" -czf /work/iwd-aarch64-musl.tar.gz .
          EOF
          chmod +x build.sh

      - name: Build in Alpine (musl)
        run: |
          docker run --rm \
            -e ALPINE_VERSION -e IWD_REF -e ELL_REF -e IW_REF \
            -v "$PWD":/work -w /work \
            "alpine:${ALPINE_VERSION}" /work/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: iwd-aarch64-musl
          path: iwd-aarch64-musl.tar.gz

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: iwd-aarch64-musl.tar.gz
